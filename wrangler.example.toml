# Example wrangler.toml for Paperless MCP Gateway
# Copy this file and customize for each deployment

name = "paperless-mcp-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Route configuration - update for your deployment
routes = [
  { pattern = "paperless-mcp.nickchristensen.house/*", custom_domain = true }
]

[vars]
# Non-secret configuration
ORIGIN_MCP_URL = "https://paperless-origin.nickchristensen.house/mcp"

# Required secrets - set via: wrangler secret put <NAME>
# Do NOT put actual secret values here!
#
# wrangler secret put ACCESS_CLIENT_ID
# wrangler secret put ACCESS_CLIENT_SECRET
# wrangler secret put ACCESS_AUTHORIZATION_URL
# wrangler secret put ACCESS_TOKEN_URL
# wrangler secret put ACCESS_JWKS_URL
# wrangler secret put COOKIE_ENCRYPTION_KEY
# wrangler secret put CF_ACCESS_CLIENT_ID
# wrangler secret put CF_ACCESS_CLIENT_SECRET
